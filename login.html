<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - UsiScan</title>
  <style>
    :root {
      --bg: #51bbb3;
      --accent: #0f2749;
      --text: #ffffff;
      --font: "Poppins", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      height: 100vh;
      background-color: #eaf6f4;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font);
    }

    .phone {
      background-color: var(--bg);
      color: var(--text);
      width: min(420px, 95vw);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      padding: 60px 24px 50px;
      position: relative;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .logo-placeholder {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 10px;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);
    }

    .logo-placeholder img {
      width: 50px;
      height: 50px;
      object-fit: contain;
      opacity: 0.9;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
    }

    .welcome-gif {
      width: 250px;
      height: auto;
      border-radius: 10px;
      margin-top: 8px;
    }

    .form-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      position: relative;
    }

    .input-wrapper {
      position: relative;
      width: 85%;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 40px;
      outline: none;
      font-size: 16px;
      font-family: var(--font);
      color: #333;
      background-color: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
    }

    .form-input:focus {
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5);
    }

    .remember-me {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 85%;
      gap: 10px;
      margin-top: -2px;
      padding: 5px 0;
      font-size: 15px;
      color: var(--text);
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      border-radius: 5px;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 14px 0;
      font-size: 18px;
      cursor: pointer;
      font-weight: 500;
      width: 85%;
      border-radius: 40px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      margin-top: 6px;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: #0d203f;
      transform: scale(1.03);
    }

    .signup-line {
      font-size: 15px;
      color: white;
      margin-top: 12px;
      opacity: 0.9;
    }

    .signup-line a {
      color: #0f2749;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s;
    }

    .signup-line a:hover {
      color: #ffffff;
    }

    .success-message {
      position: absolute;
      bottom: 40%;
      left: 50%;
      transform: translateX(-50%);
      background: #0f2749;
      color: white;
      padding: 14px 28px;
      border-radius: 30px;
      opacity: 0;
      font-size: 15px;
      font-weight: 500;
      animation: fadeInOut 2.5s ease forwards;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, 20px); }
      20%, 80% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -20px); }
    }

    @media (max-width: 480px) {
      h1 { font-size: 28px; }
      .welcome-gif { width: 130px; }
      .btn { font-size: 16px; }
      .form-input { font-size: 15px; }
      .logo-placeholder { width: 75px; height: 75px; }
      .logo-placeholder img { width: 45px; height: 45px; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="top-section">
      <div class="logo-placeholder">
        <img src="logo1.png" alt="UsiScan Logo" />
      </div>
      <h1>Welcome Back</h1>
      <img src="login.gif" alt="Login Animation" class="welcome-gif" />
    </div>

    <div class="form-section">
      <div class="input-wrapper">
        <input type="email" id="loginEmail" placeholder="Email Address" class="form-input" required />
      </div>

      <div class="input-wrapper">
        <input type="password" id="loginPassword" placeholder="Password" class="form-input" required />
      </div>

      <div class="remember-me">
        <input type="checkbox" id="rememberMe">
        <label for="rememberMe">Remember Me</label>
      </div>

      <button class="btn" onclick="handleLogin()">Login</button>

      <div class="signup-line">
        Don’t have an account? <a href="signup.html">Sign up</a>
      </div>
    </div>
  </div>

  <script>
    // ✅ Correct email validation
    function validateEmail(email) {
      const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return regex.test(email);
    }

    // ✅ Handle Login
    function handleLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      const rememberMe = document.getElementById("rememberMe").checked;

      const users = JSON.parse(localStorage.getItem("users")) || [];
      const user = users.find(u => u.email === email && u.password === password);

      if (email === "" || password === "") {
        alert("Please fill in all fields.");
        return;
      }

      if (!validateEmail(email)) {
        alert("Please enter a valid email address.");
        return;
      }

      if (!user) {
        alert("Invalid email or password.");
        return;
      }

      // ✅ Store session data
      localStorage.setItem("currentUser", JSON.stringify({
        username: user.username,
        email: user.email,
      }));

      if (rememberMe) {
        localStorage.setItem("rememberUser", JSON.stringify(user));
      } else {
        localStorage.removeItem("rememberUser");
      }

      // ✅ Display success message and redirect
      const msg = document.createElement("div");
      msg.className = "success-message";
      msg.textContent = "Login successful!";
      document.body.appendChild(msg);

      setTimeout(() => {
        window.location.href = "index.html";
      }, 2000);
    }

    // ✅ Auto-fill remembered user
    document.addEventListener("DOMContentLoaded", () => {
      const remembered = JSON.parse(localStorage.getItem("rememberUser"));
      if (remembered) {
        document.getElementById("loginEmail").value = remembered.email;
        document.getElementById("rememberMe").checked = true;
      }
    });
  </script>
</body>
</html>
