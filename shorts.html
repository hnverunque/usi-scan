<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UsiScan Shorts</title>
  <style>
    :root {
      --bg:#eaf6f4;
      --card:#ffffff;
      --accent:#3fc1b9;
      --muted:#9aa6ad;
      --deep:#0f2b3a;
      --soft:#f5f8f9;
      --pill:#eef6f5;
      --radius:18px;
      --ui-width:min(420px,98vw);
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      font-family:Inter,system-ui,'Segoe UI',Roboto,Arial;
      background:linear-gradient(180deg,var(--bg),#fbffff);
      color:var(--deep);
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .phone{
      width:var(--ui-width);
      height:100vh;
      background:#fff;
      box-shadow:0 18px 40px rgba(8,20,30,0.12);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      position:relative;
    }

    .sticky-header {
      position:sticky;
      top:0;
      z-index:10;
      background:#fff;
      height:230px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-size:18px;
      color:var(--deep);
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
    }

    .screen{padding:20px;overflow:auto;flex:1 1 auto;}

    .shorts-feed{
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .short-card{
      width:100%;
      aspect-ratio:9/16;
      background:#d2f0f0;
      border-radius:18px;
      overflow:hidden;
      position:relative;
      display:flex;
      align-items:flex-end;
      justify-content:flex-start;
      padding:12px;
      color:white;
      font-weight:600;
      font-size:16px;
      background-size:cover;
      background-position:center;
    }

    .short-card::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(to top, rgba(0,0,0,0.4), transparent);
      border-radius:18px;
    }

    .short-card span{
      position:relative;
      z-index:1;
    }

    /* Vertical action bar */
    .action-bar {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 2;
    }

    .action-item {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: background 0.2s;
    }

    .action-item:hover {
      background: rgba(0,0,0,0.2);
    }

    .action-item.profile {
      padding: 2px;
      background: none;
    }

    .action-item.profile img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid white;
      object-fit: cover;
    }

    .bottom-nav{
      height:84px;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 18px;
      background:linear-gradient(180deg,rgba(235,247,245,0.9),rgba(240,252,252,0.95));
      border-top:1px solid rgba(10,30,40,0.03);
      position:sticky;
      bottom:0;
      flex-shrink:0;
    }
    .nav-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .nav-item{
      flex:1;
      text-align:center;
      padding:8px 6px;
      font-size:12px;
      color:var(--muted);
      cursor:pointer;
      transition:color 0.3s, transform 0.2s;
    }
    .nav-item svg{
      display:block;
      margin:0 auto 4px;
      width:22px;
      height:22px;
      stroke:var(--muted);
      transition:stroke 0.3s;
    }
    .nav-item.active{color:var(--accent);font-weight:600;}
    .nav-item.active svg{stroke:var(--accent);}
    .nav-item:hover{transform:scale(1.05);color:var(--accent);}
    .nav-item:hover svg{stroke:var(--accent);}

    .fab{
      width:72px;
      height:72px;
      border-radius:50%;
      background:var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      position:absolute;
      top:-32px;
      left:50%;
      transform:translateX(-50%);
      box-shadow:0 12px 26px rgba(63,193,185,0.24);
      border:6px solid white;
      cursor:pointer;
    }
    .fab svg{width:30px;height:30px;}
  </style>
</head>

    function setActive(selected){

      navItems.forEach(item => item.classList.remove('active'));
      selected.classList.add('active');
    }
