<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History - UsiScan</title>
  <style>
    :root {
      --bg:#eaf6f4;
      --accent:#3fc1b9;
      --muted:#9aa6ad;
      --deep:#0f2b3a;
      --ui-width:min(420px,98vw);
      --nav-height:84px;
      --shadow:0 6px 18px rgba(10,30,40,0.08);
      --radius:18px;
    }

    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,'Segoe UI',Roboto,Arial;background:var(--bg);color:var(--deep);display:flex;justify-content:center;align-items:center;}
    .phone{width:var(--ui-width);height:100vh;background:#fff;box-shadow:0 18px 40px rgba(8,20,30,0.12);overflow:hidden;display:flex;flex-direction:column;position:relative;}

    .sticky-header {
      position:sticky;
      top:0;
      z-index:10;
      background:#fff;
      height:64px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-size:18px;
      color:var(--deep);
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
    }

    .screen{padding:20px;overflow:auto;flex:1 1 auto;}

    .toggle-header {
      display:flex;
      border-radius:18px;
      background:var(--pill,#eef6f5);
      overflow:hidden;
      margin-bottom:16px;
      border:1px solid rgba(10,30,40,0.08);
    }
    .toggle-header div{
      flex:1;
      text-align:center;
      padding:10px 0;
      cursor:pointer;
      font-weight:600;
      transition: background 0.3s, color 0.3s;
    }
    .toggle-header .active{
      background:var(--accent);
      color:#fff;
    }

    .placeholder{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      margin-top:100px;
      text-align:center;
      gap:12px;
    }
    .placeholder img{
    width:200px;
    height:140px;
    border-radius:12px;
    background:#d2f0f0;
    object-fit:cover;
    }
    .placeholder h1{
    margin:0;
    font-size:20px; /* smaller than before */
    }
    .placeholder h2{
    margin:0;
    font-size:14px; /* smaller than before */
    color:var(--muted);
    font-weight:400;
    }

    .history-list{
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .history-item{
      background:var(--card,#fff);
      padding:12px 16px;
      border-radius:18px;
      box-shadow:var(--shadow);
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    .bottom-nav{
      height:var(--nav-height);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 18px;
      background:linear-gradient(180deg,rgba(235,247,245,0.9),rgba(240,252,252,0.95));
      border-top:1px solid rgba(10,30,40,0.03);
      position:sticky;
      bottom:0;
      flex-shrink:0;
    }
    .nav-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .nav-item{
      flex:1;
      text-align:center;
      padding:8px 6px;
      font-size:12px;
      color:var(--muted);
      cursor:pointer;
      transition:color 0.3s, transform 0.2s;
    }
    .nav-item svg{
      display:block;
      margin:0 auto 4px;
      width:22px;
      height:22px;
      stroke:var(--muted);
      transition:stroke 0.3s;
    }
    .nav-item.active{color:var(--accent);font-weight:600;}
    .nav-item.active svg{stroke:var(--accent);}
    .nav-item:hover{transform:scale(1.05);color:var(--accent);}
    .nav-item:hover svg{stroke:var(--accent);}

    .fab{
      width:72px;
      height:72px;
      border-radius:50%;
      background:var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      position:absolute;
      top:-32px;
      left:50%;
      transform:translateX(-50%);
      box-shadow:0 12px 26px rgba(63,193,185,0.24);
      border:6px solid white;
      cursor:pointer;
    }
    .fab svg{width:30px;height:30px;}
  </style>
</head>
<body>
  <div class="phone">
    <div class="sticky-header">History</div>

    <main class="screen">
      <div class="toggle-header">
        <div id="recentsToggle" class="active" onclick="showSection('recents')">Recents</div>
        <div id="favoritesToggle" onclick="showSection('favorites')">Favorites</div>
      </div>

      <div id="recentsSection">
        <!-- If there are recent scans, list them here -->
        <div class="placeholder">
          <img alt="Cute placeholder" />
          <h1>Scan your first product</h1>
          <h2>To find out the information of a product, take its photo or scan its barcode.</h2>
        </div>
        <!-- Example for future recent items -->
        <!--
        <div class="history-list">
          <div class="history-item">Product A</div>
          <div class="history-item">Product B</div>
        </div>
        -->
      </div>

      <div id="favoritesSection" style="display:none;">
        <!-- If user has favorites -->
        <div class="placeholder">
          <img alt="Cute placeholder" />
          <h1>No favorites yet</h1>
          <h2>We'll keep the products and practices that won your heart here.</h2>
        </div>
        <!-- Example for future favorites items -->
        <!--
        <div class="history-list">
          <div class="history-item">Herbal Wash</div>
          <div class="history-item">Vitamin C</div>
        </div>
        -->
      </div>
    </main>

    <nav class="bottom-nav">
      <div class="nav-row">
        <div class="nav-item" onclick="setActive(this); goTo('index.html')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V12H9v8a2 2 0 0 1-2 2H3z"/></svg>
          Home
        </div>
        <div class="nav-item" onclick="setActive(this); goTo('shorts.html')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
          Shorts
        </div>
        <div style="width:84px"></div>
        <div class="nav-item active" onclick="setActive(this); goTo('history.html')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-5H1"/></svg>
          History
        </div>
        <div class="nav-item" onclick="setActive(this); goTo('profile.html')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-3-3.87"/><path d="M4 21v-2a4 4 0 0 1 3-3.87"/><circle cx="12" cy="7" r="4"/></svg>
          Profile
        </div>
      </div>

      <!-- FAB Camera -->
      <button class="fab" onclick="goTo('camera.html')" aria-label="Open camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
      </button>
    </nav>
  </div>

  <script>
    function goTo(page){ window.location.href = page; }
    function setActive(selected){
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach(item => item.classList.remove('active'));
      selected.classList.add('active');
    }

    function showSection(section){
      const recents = document.getElementById('recentsSection');
      const favorites = document.getElementById('favoritesSection');
      const recentsToggle = document.getElementById('recentsToggle');
      const favoritesToggle = document.getElementById('favoritesToggle');

      if(section === 'recents'){
        recents.style.display = 'block';
        favorites.style.display = 'none';
        recentsToggle.classList.add('active');
        favoritesToggle.classList.remove('active');
      } else {
        recents.style.display = 'none';
        favorites.style.display = 'block';
        recentsToggle.classList.remove('active');
        favoritesToggle.classList.add('active');
      }
    }
  </script>
</body>
</html>
