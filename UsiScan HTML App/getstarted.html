<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome - UsiScan</title>
<style>
  :root {
    --bg: #183051;
    --accent: #4ec6bc;
    --text: #ffffff;
    --font: "Poppins", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    height: 100vh;
    width: 100%;
    background-color: #eaf6f4;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: var(--font);
  }

  .phone {
    background-color: var(--bg);
    color: var(--text);
    width: min(420px, 95vw);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    padding: 40px 24px 50px;
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    animation: phoneScan 2s linear infinite alternate;
  }

  @keyframes phoneScan {
    0% { box-shadow: inset 0 0 0 rgba(78,198,188,0); }
    50% { box-shadow: inset 0 0 60px rgba(78,198,188,0.2); }
    100% { box-shadow: inset 0 0 0 rgba(78,198,188,0); }
  }

  .top-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 100%;
    margin-top: 60px;
  }

  .logo-placeholder {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background-color: #183051;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 6px;
    transform: scale(0.5) translateY(-100px);
    animation: logoMove 2s ease forwards, scanEffect 1.5s ease-in-out 0.5s infinite alternate;
  }

  .logo-placeholder img {
    width: 70px;
    height: 70px;
    object-fit: contain;
    opacity: 0.9;
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    opacity: 0;
    animation: fadeInText 1s forwards 2s;
  }

  .tagline {
    font-size: 15px;
    margin: 0;
    opacity: 0;
    animation: fadeInText 1s forwards 2.1s;
  }

  .subtext {
    font-size: 12px;
    font-style: italic;
    margin: 0;
    opacity: 0;
    animation: fadeInText 1s forwards 2.2s;
  }

  @keyframes logoMove {
    0%   { transform: scale(0.5) translateY(-100px); opacity: 0; }
    70%  { transform: scale(1.1) translateY(5px); opacity: 1; }
    100% { transform: scale(1) translateY(0); }
  }

  @keyframes scanEffect {
    0%   { box-shadow: 0 0 0 0 rgba(78,198,188,0.5); }
    100% { box-shadow: 0 0 40px 10px rgba(78,198,188,0); }
  }

  @keyframes fadeInText {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bottom-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    width: 100%;
    margin-bottom: 10px;
    margin-top: auto;
  }

  .btn, .login-link {
    position: relative;
    overflow: hidden;
  }

  .btn {
    background-color: var(--accent);
    color: white;
    border: none;
    padding: 14px 0;
    font-size: 18px;
    cursor: pointer;
    font-weight: 500;
    text-decoration: none;
    transition: all 0.3s ease;
    width: 80%;
    border-radius: 40px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInBtn 1s forwards 2.5s;
  }

  .login-link {
    font-size: 16px;
    color: white;
    opacity: 0.85;
    text-decoration: none;
    transition: opacity 0.3s;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeInBtn 1s forwards 2.6s;
  }

  @keyframes fadeInBtn {
    to { opacity: 1; transform: translateY(0); }
  }

  .btn:hover { background-color: #44b0a6; transform: scale(1.03); }
  .login-link:hover { opacity: 1; }

  /* Ripple effect */
  .btn::after, .login-link::after {
    content: '';
    position: absolute;
    width: 200%;
    height: 200%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(78,198,188,0.5);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.6s, opacity 0.6s;
  }

  .btn:active::after, .login-link:active::after {
    transform: translate(-50%, -50%) scale(1);
    opacity: 0.4;
    transition: transform 0.3s, opacity 0.6s;
  }

  @media (max-width: 480px) {
    h1 { font-size: 28px; }
    .btn { width: 85%; font-size: 16px; }
    .logo-placeholder { width: 75px; height: 75px; }
    .logo-placeholder img { width: 45px; height: 45px; }
    .tagline { font-size: 14px; }
    .subtext { font-size: 11px; }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="top-section">
      <div class="logo-placeholder">
        <img src="logo.png" alt="UsiScan Logo" />
      </div>
      <h1>UsiScan</h1>
      <div class="tagline">Scan Smart, Stay Safe</div>
      <div class="subtext">In partnership with FDA & DOH</div>
    </div>

    <div class="bottom-section">
      <a href="signup.html" class="btn">Get Started</a>
      <a href="login.html" class="login-link">Login</a>
    </div>
  </div>
</body>
</html>
