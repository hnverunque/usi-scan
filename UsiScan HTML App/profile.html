<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile - UsiScan</title>
  <style>
    :root {
      --bg:#eaf6f4;
      --accent:#3fc1b9;
      --muted:#9aa6ad;
      --deep:#0f2b3a;
      --ui-width:min(420px,98vw);
      --nav-height:84px;
      --shadow:0 6px 18px rgba(10,30,40,0.08);
    }

    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,'Segoe UI',Roboto,Arial;background:var(--bg);color:var(--deep);display:flex;justify-content:center;align-items:center;}
    .phone{width:var(--ui-width);height:100vh;background:#fff;box-shadow:0 18px 40px rgba(8,20,30,0.12);overflow:hidden;display:flex;flex-direction:column;position:relative;}

    /* Sticky Header */
    .sticky-header {
      position:sticky;
      top:0;
      z-index:10;
      background:#fff;
      height:64px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:700;
      font-size:18px;
      color:var(--deep);
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
    }

    .screen{padding:20px;overflow:auto;flex:1 1 auto;}

    /* Profile Options */
    .profile-options div{
      padding:12px 0;
      border-bottom:1px solid rgba(10,30,40,0.08);
      cursor:pointer;
      color:var(--deep);
      font-weight:500;
    }
    .profile-options div:hover{color:var(--accent);}

    /* Bottom Navigation */
    .bottom-nav{
      height:var(--nav-height);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 18px;
      background:linear-gradient(180deg,rgba(235,247,245,0.9),rgba(240,252,252,0.95));
      border-top:1px solid rgba(10,30,40,0.03);
      position:sticky;
      bottom:0;
      flex-shrink:0;
    }
    .nav-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .nav-item{
      flex:1;
      text-align:center;
      padding:8px 6px;
      font-size:12px;
      color:var(--muted);
      cursor:pointer;
      transition:color 0.3s, transform 0.2s;
    }
    .nav-item svg{
      display:block;
      margin:0 auto 4px;
      width:22px;
      height:22px;
      stroke:var(--muted);
      transition:stroke 0.3s;
    }
    .nav-item.active{color:var(--accent);font-weight:600;}
    .nav-item.active svg{stroke:var(--accent);}
    .nav-item:hover{transform:scale(1.05);color:var(--accent);}
    .nav-item:hover svg{stroke:var(--accent);}

    /* FAB Camera Button */
    .fab{
      width:72px;
      height:72px;
      border-radius:50%;
      background:var(--accent);
      display:flex;
      align-items:center;
      justify-content:center;
      position:absolute;
      top:-32px;
      left:50%;
      transform:translateX(-50%);
      box-shadow:0 12px 26px rgba(63,193,185,0.24);
      border:6px solid white;
      cursor:pointer;
    }
    .fab svg{width:30px;height:30px;}
  </style>
</head>
<body>
  <div class="phone">
    <!-- Header -->
    <div class="sticky-header">Profile</div>

    <main class="screen">
      <!-- Profile Options -->
      <div class="profile-options">
        <div>User Profile</div>
        <div onclick="goTo('history.html')">History</div>
        <div onclick="goTo('privacy.html')">Privacy Policy</div>
        <div onclick="goTo('terms.html')">Terms of Use</div>
        <div onclick="goTo('contact.html')">Contact / Help Support</div>
        <div onclick="goTo('logout.html')" style="color:#ff6b6b;">Logout</div>
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <div class="nav-row">
        <div class="nav-item" onclick="setActive(this); goTo('index.html')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V12H9v8a2 2 0 0 1-2 2H3z"/>
          </svg>
          Home
        </div>
        <div class="nav-item" onclick="setActive(this); goTo('shorts.html')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"/>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
          </svg>
          Shorts
        </div>
        <div style="width:84px"></div>
        <div class="nav-item" onclick="setActive(this); goTo('history.html')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 .49-5H1"/>
          </svg>
          History
        </div>
        <div class="nav-item active" onclick="setActive(this); goTo('profile.html')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M4 21v-2a4 4 0 0 1 3-3.87"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Profile
        </div>
      </div>

      <!-- FAB Camera -->
      <button class="fab" onclick="goTo('camera.html')" aria-label="Open camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3l2-3h8l2 3h3a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="3"/>
        </svg>
      </button>
    </nav>
  </div>

  <script>
    function goTo(page){ window.location.href = page; }
    function logout(){
      localStorage.removeItem('currentUser');
      alert("You have been logged out.");
      goTo('index.html');
    }
    function setActive(selected){
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach(item => item.classList.remove('active'));
      selected.classList.add('active');
    }
  </script>
</body>
</html>
