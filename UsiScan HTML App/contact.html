<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact / Help Support - UsiScan</title>
  <style>
    :root {
      --bg:#eaf6f4;
      --accent:#3fc1b9;
      --muted:#9aa6ad;
      --deep:#0f2b3a;
      --ui-width:min(420px,98vw);
      --shadow:0 6px 18px rgba(10,30,40,0.08);
    }
    *{box-sizing:border-box;}
    html,body{
      height:100%;
      margin:0;
      font-family:Inter,system-ui,'Segoe UI',Roboto,Arial;
      background:var(--bg);
      color:var(--deep);
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .phone{
      width:var(--ui-width);
      height:100vh;
      background:#fff;
      box-shadow:0 18px 40px rgba(8,20,30,0.12);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      position:relative;
    }
    .sticky-header {
      position:sticky;
      top:0;
      z-index:10;
      background:#fff;
      height:64px;
      display:flex;
      align-items:center;
      padding:0 16px;
      box-shadow:0 2px 8px rgba(0,0,0,0.05);
    }
    .exit-btn {
      font-size:22px;
      font-weight:bold;
      cursor:pointer;
      margin-right:12px;
      color:var(--muted);
    }
    .header-title {
      font-weight:700;
      font-size:18px;
      color:var(--deep);
    }
    .screen{
      padding:20px;
      overflow:auto;
      flex:1 1 auto;
    }
    h2.section-title{
      font-size:20px;
      margin-bottom:12px;
    }
    p{
      margin-bottom:12px;
      line-height:1.5;
      font-size:14px;
      color:var(--deep);
    }
    a{color:var(--accent); text-decoration:none;}
    a:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <div class="phone">
    <!-- Header -->
    <div class="sticky-header">
      <div class="exit-btn" onclick="goBack()">✕</div>
      <div class="header-title">Contact / Help Support</div>
    </div>

    <!-- Main Content -->
    <main class="screen">
      <h2 class="section-title">Get in Touch</h2>
      <p>For support, questions, or feedback, you can reach us through:</p>
      <p>Email: <a href="mailto:support@usiscan.com">support@usiscan.com</a></p>
      <p>Phone: <a href="tel:+1234567890">+1 234 567 890</a></p>
      <p>Visit our FAQ page for quick answers to common issues.</p>
      <p>We aim to respond to all inquiries within 24 hours.</p>
    </main>
  </div>

  <script>
    function goBack(){ window.history.back(); }
  </script>
</body>
</html>
